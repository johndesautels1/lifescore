# One-off report: type-check the server functions (api/) and list every error.
# api/ has never been type-checked (tsc -b covers only src/ and vite.config.ts);
# this report drives the fixes, after which the check joins ci.yml as a
# required step and this file is removed.
name: Server type-check report

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - name: Type check api/
        run: node node_modules/typescript/bin/tsc -p tsconfig.api.json --pretty false
