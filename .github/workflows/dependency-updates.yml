# Updates the libraries to their newest releases allowed by package.json, on GitHub's
# machines (never locally: the founder's machine has too little free memory to resolve
# the dependency tree), proves the result, and offers it as a pull request to review — it
# never pushes to main. John, 4 Oct 2026: scheduled checks, "dependency changes auto-update".
#
# - Runs weekly (Monday 05:30 UTC, after the security fixes) and on demand.
# - `npm update --package-lock-only` stays within each package's range; new MAJOR
#   versions are not taken but listed in the pull request (scripts/outdated-report.mjs),
#   since each needs its own upgrade and testing.
# - The result must install with `npm ci`, pass both type checks, the test suite and the
#   production build, and keep every start-up file precached, before the branch is pushed.
name: Dependency updates

on:
  schedule:
    - cron: "30 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependency-updates
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: What is out of date (before)
        run: npm outdated --json > "$RUNNER_TEMP/outdated.json" || true

      - name: Update the lockfile within the allowed ranges
        run: npm update --package-lock-only

      - name: Nothing changed?
        id: diff
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No updates within the allowed ranges."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- package-lock.json
          fi

      - name: Install exactly from the new lockfile
        if: steps.diff.outputs.changed == 'true'
        run: npm ci

      - name: Type check (same as the Vercel build)
        if: steps.diff.outputs.changed == 'true'
        run: node node_modules/@typescript/native/bin/tsc -b

      - name: Type check the server functions (api/)
        if: steps.diff.outputs.changed == 'true'
        run: node node_modules/@typescript/native/bin/tsc -p tsconfig.api.json

      - name: Tests
        if: steps.diff.outputs.changed == 'true'
        run: npx vitest run

      - name: Production build
        if: steps.diff.outputs.changed == 'true'
        run: npx vite build

      - name: Every start-up file is precached for offline use
        if: steps.diff.outputs.changed == 'true'
        run: node scripts/check-precache-shell.mjs

      - name: Offer the updates as a pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          branch="deps/weekly-updates"
          majors="$(node scripts/outdated-report.mjs "$RUNNER_TEMP/outdated.json")"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add package-lock.json
          git commit -m "chore(deps): library updates within allowed ranges (weekly)" -m "Generated by .github/workflows/dependency-updates.yml: npm update --package-lock-only. npm ci, tsc -b, the api/ type check, vitest, the production build and the precache check passed on this lockfile."
          git push --force origin "$branch"
          body="Weekly library updates within the ranges package.json allows, generated by the Dependency updates workflow. Installed with npm ci; both type checks, the tests, the production build and the precache check passed before this branch was pushed. Review the lockfile diff before merging.

          ${majors}"
          gh pr create --base main --head "$branch" --title "Library updates (weekly)" --body "$body" \
            || gh pr edit "$branch" --body "$body" \
            || echo "A pull request for $branch is already open, or this repository does not let workflows open pull requests: open one from $branch."
