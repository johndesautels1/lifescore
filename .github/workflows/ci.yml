# Runs on every push to main and every pull request, on GitHub's machines (never locally).
# - install: `npm ci` fails if package.json and package-lock.json disagree — the drift that froze
#   production from 9 Jul to 3 Oct 2026 (simli-client asked for ^3 while the lockfile said 2.0.0).
# - typecheck: the same `tsc -b` the Vercel build runs, so a type error is caught before deploy.
# - test: the vitest suite, including the anti-drift guards.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install (fails if the lockfile has drifted from package.json)
        run: npm ci

      - name: Type check (same as the Vercel build)
        run: node node_modules/typescript/bin/tsc -b

      - name: Tests
        run: npx vitest run
