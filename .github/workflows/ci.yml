# Runs on every push to main, every pull request and every Monday 06:00 UTC, on GitHub's
# machines (never locally). The weekly run repeats the whole check on main with no new
# code, so anything that goes stale with time alone (a dated rule, a library that resolves
# differently) fails within a week rather than at the next push (John, 4 Oct 2026:
# scheduled checks). The manuals step runs on pushes only.
# - install: `npm ci` fails if package.json and package-lock.json disagree — the drift that froze
#   production from 9 Jul to 3 Oct 2026 (simli-client asked for ^3 while the lockfile said 2.0.0).
# - typecheck: the same `tsc -b` the Vercel build runs, so a type error is caught before deploy.
#   TypeScript 7 (the native compiler, package alias @typescript/native) does the checking;
#   the `typescript` package is TypeScript 6 for the tools that need its programming interface
#   (typescript-eslint), as Microsoft advises until TypeScript 7.1 ships one.
# - server typecheck: api/ is compiled separately by Vercel and `tsc -b` does not cover it.
#   Its first check (3 Oct 2026) found 145 errors, three of them live crashes; it now gates every push.
# - manuals: on a push to main, written manual sections whose code changed are rewritten by
#   Claude (scripts/manuals-autoupdate.ts) and committed back BEFORE the tests check them
#   (tests/manuals.test.ts). Needs the ANTHROPIC_API_KEY repository secret; without it nothing
#   is rewritten and the test names any section a person must update.
# - test: the vitest suite, including the anti-drift guards.
# - build: the production build, then every file the built page loads at start must be in the
#   offline precache (on 4 Oct 2026 Vite 8 added rolldown-runtime-*.js and nothing noticed).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write # the manuals step commits its updates back to main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the manuals step reads what changed since each section's review

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install (fails if the lockfile has drifted from package.json)
        run: npm ci

      - name: Type check (same as the Vercel build)
        run: node node_modules/@typescript/native/bin/tsc -b

      - name: Type check the server functions (api/)
        run: node node_modules/@typescript/native/bin/tsc -p tsconfig.api.json

      - name: Bring the manuals up to date with this push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          npx tsx scripts/manuals-autoupdate.ts
          if ! git diff --quiet -- docs/manuals; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/manuals
            git commit -m "docs(manuals): sections brought up to date with ${GITHUB_SHA::7}" -m "Rewritten by scripts/manuals-autoupdate.ts in CI against the code they cover; tests/manuals.test.ts checked them in the same run."
            git pull --rebase origin main && git push origin HEAD:main || echo "Could not push the manual update (main moved on); the next push redoes it."
          fi

      - name: Tests
        run: npx vitest run

      - name: Production build
        run: npx vite build

      - name: Every start-up file is precached for offline use
        run: node scripts/check-precache-shell.mjs
