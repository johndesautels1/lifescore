# Applies npm's security fixes on GitHub's machines (never locally: the founder's
# machine has too little free memory to resolve the dependency tree) and offers
# them as a pull request to review — it never pushes to main.
#
# - Runs weekly (Monday 05:00 UTC) and on demand, so security fixes cannot pile
#   up again: on 3 Oct 2026 there were 38 open advisories (2 critical, 28 high).
# - `npm audit fix` stays within each package's allowed version range; sharp
#   (development-only, used by scripts/generate-pwa-icons.cjs) is lifted to
#   0.35.5, the release that carries its fixed libvips.
# - The result must install with `npm ci`, pass the same type checks as CI
#   (the app's `tsc -b` and the server's tsconfig.api.json), and pass the test
#   suite before the branch is pushed.
name: Dependency security fixes

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependency-security
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Advisories before
        run: npm audit --audit-level=low || true

      - name: Apply fixes to the lockfile (within allowed ranges)
        run: npm audit fix --package-lock-only || true

      - name: Lift sharp to the release with fixed libvips
        run: npm install --package-lock-only --save-dev sharp@0.35.5

      - name: Advisories after
        run: npm audit --audit-level=low || true

      - name: Nothing changed?
        id: diff
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No dependency changes."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- package.json package-lock.json
          fi

      - name: Install exactly from the new lockfile
        if: steps.diff.outputs.changed == 'true'
        run: npm ci

      - name: Type check (same as the Vercel build)
        if: steps.diff.outputs.changed == 'true'
        run: node node_modules/@typescript/native/bin/tsc -b

      - name: Type check the server functions (api/)
        if: steps.diff.outputs.changed == 'true'
        run: node node_modules/@typescript/native/bin/tsc -p tsconfig.api.json

      - name: Tests
        if: steps.diff.outputs.changed == 'true'
        run: npx vitest run

      - name: Offer the fixes as a pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          branch="deps/security-fixes"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add package.json package-lock.json
          git commit -m "chore(deps): npm security fixes (weekly)" -m "Generated by .github/workflows/dependency-security.yml: npm audit fix within allowed ranges, sharp 0.35.5. npm ci, tsc -b, the api/ type check and vitest passed on this lockfile."
          git push --force origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "Dependency security fixes" \
            --body "Weekly npm security fixes, generated by the Dependency security fixes workflow. Installed with npm ci; type check and tests passed before this branch was pushed. Review the lockfile diff before merging." \
            || echo "A pull request for $branch is already open, or this repository does not let workflows open pull requests: open one from $branch."
